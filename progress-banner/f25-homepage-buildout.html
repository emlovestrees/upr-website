<script>
    var total = 1855; //running total updated through March 21, 2025
        
    var goal = 75000; //set the overall drive goal
    var countDownDate = new Date("Sept 26, 2025 18:59:59").getTime(); //Set the date & time the drive ends

    var giftTotal = 13;
    var giftGoal = 500;
    </script>
    
    <div id="buildout">
        <h2 style="text-align: center;">Fall 2025 Fund Drive</h2>
        <p id="featured-text">UPR’s Fall Fund Drive starts today! Every donation we receive during this drive also sends two boxes of Post Consumer Brands cereal to the Utah Food Bank. Make one donation, do TWO good deeds! GIVE NOW</p>
        <div id="contains-meters"> <!--This div has the progress bars inside it-->
            <div class="progress-container">
                <a href="https://donate.nprstations.org/upr/support-upr" target="_blank" style="color:#000;">
                    <div style="float: left; font-weight:bold; padding:20px;"><span class="no-mobile">HELP US REACH OUR </span>DOLLAR GOAL
                        <br><span id="dollars-remaining" style="font-weight:normal;font-size:smaller;"></span>
                    </div>
                    <div id="progress-bar">
                    </div>
                </a>
            </div>
            <div class="progress-container"> <!--This is a progress meter for how many gifts we receive-->
                <a href="https://donate.nprstations.org/upr/support-upr" target="_blank" style="color:#000;">
                    <div style="float: left; font-weight:bold; padding:20px;"><span class="no-mobile">HELP US REACH OUR </span>GIFT GOAL 
                        <br><span id="gifts-remaining" style="font-weight:normal;font-size:smaller;"></span>
                    </div>
                    <div id="progress-bar2">
                    </div>
                </a>
            </div>
        </div>
        <div style="display: flex; justify-content: center;"> <!--This div exists to center the button-->
            <button style="width: fit-content; font-weight:bold;text-align: right;  padding:5px; margin:23px 0 0 0;border-radius:10px;background:#D63230;color:#fff; border: 0px;"> &#x2665; DONATE NOW! 
                <br><span id="days-remaining" style="font-weight: normal;font-size: small;"></span>
            </button>
        </div>
    </div>
    
    <style>
        @media only screen and (max-width: 600px) {
            .no-mobile {display: none;}
            .donate-now {margin-top:10px;}
        }
        @keyframes progress-slide {
            0%   {width:0;}
        }

        #buildout {
            background-color: #FBE2B1;
        }

        #contains-meters {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px;
        }

        .progress-container {
            height: 80px;
            background-color: #eee;
            padding: 1px;
            border-radius: 10px;
        }

        #progress-bar,
        #progress-bar2 {
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            background-color:#b0d43b;
            height: 100%; 
            display: block; 
            animation-name: progress-slide; 
            animation-duration: 3s;
        }

        #featured-text {
            text-align: center;
            padding-top: 10px;
        }
    </style>
    
    <script>
        var leftToGoal = goal - total;
        var percentToGoal = total / goal * 100;
        document.getElementById('progress-bar').style.width = (percentToGoal + '%'); 
        if (leftToGoal < 0) {
            document.getElementById('dollars-remaining').innerHTML = ('Goal achieved. Thank you!');
        } 
        else {
            document.getElementById('dollars-remaining').innerHTML = ('$' + leftToGoal.toLocaleString( undefined ) + ' remaining <span class="nomobile">to goal</span> ');
        }

        var leftToGiftGoal = giftGoal - giftTotal;
        var percentToGiftGoal = giftTotal / giftGoal * 100;
        document.getElementById('progress-bar2').style.width = (percentToGiftGoal + '%');
        if (leftToGiftGoal < 0) {
            document.getElementById('gifts-remaining').innerHTML = ('Thanks for helping us reach our goal!');
        }
        else {
            document.getElementById('gifts-remaining').innerHTML = (leftToGiftGoal.toLocaleString( undefined) + ' gifts remaining <span class="nomobile">to goal</span> ');
        }
        
    </script>
    
    <script>
      //end date & time set above
        
      // Update the count down every 1 second
      var x = setInterval(function() {
    
      // Get today's date and time
      var now = new Date().getTime();
        
      // Find the distance between now and the count down date
      var distance = countDownDate - now;
        
      // Time calculations for days, hours, minutes and seconds
      var days = Math.floor(distance / (1000 * 60 * 60 * 24));
      var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((distance % (1000 * 60)) / 1000);
        
      // Output the result in an element with id="days-remaining"
      
      if (hours < 1) {
          document.getElementById("days-remaining").innerHTML = minutes + " minutes left" ;  }
      else if (days < 1) {   
      document.getElementById("days-remaining").innerHTML = hours + " hours left" ;  }
      else if (days < 2 ) {
      document.getElementById("days-remaining").innerHTML = days + " day left" ;     clearInterval(x); }  
      else {  
      document.getElementById("days-remaining").innerHTML = days + " days left" ;     clearInterval(x); }
        
      // If the count down is over, write some text 
      if (distance < 0) {
        clearInterval(x);
        document.getElementById("days-remaining").innerHTML = "";
      }
    }, 1000);
    </script>
